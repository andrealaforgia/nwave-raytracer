# nWave Bowling Demo Scene
# Glass chessboard floor, colored pixel-art letters, green glass W.
# A bowling ball rolls toward the W, scattering its glass blocks.
# After the sweeper clears, textured spheres roll across one after another.
# Earth finale: rotating tilted Earth with orbiting Moon.

materials:
  - name: white_metal
    type: metal
    albedo: [0.9, 0.9, 0.9]
    fuzz: 0.05
  - name: black_metal
    type: metal
    albedo: [0.1, 0.1, 0.1]
    fuzz: 0.05
  - name: green_glass
    type: dielectric
    ior: 1.5
    tint: [0.4, 0.95, 0.4]
  - name: red_mat
    type: lambertian
    albedo: [0.85, 0.15, 0.15]
  - name: blue_mat
    type: lambertian
    albedo: [0.15, 0.25, 0.85]
  - name: orange_mat
    type: lambertian
    albedo: [0.9, 0.55, 0.1]
  - name: purple_mat
    type: lambertian
    albedo: [0.6, 0.2, 0.8]
  - name: ball_metal
    type: metal
    albedo: [0.3, 0.3, 0.3]
    fuzz: 0.02
  - name: pink_jelly
    type: dielectric
    ior: 1.15
    tint: [0.95, 0.5, 0.7]
  - name: blue_glass
    type: dielectric
    ior: 1.5
    tint: [0.7, 0.75, 0.98]
