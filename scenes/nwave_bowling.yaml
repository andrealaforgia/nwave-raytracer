    type: metal
    albedo: [0.1, 0.1, 0.1]
    fuzz: 0.05
  - name: green_glass
    type: dielectric
    ior: 1.5
    tint: [0.4, 0.95, 0.4]
  - name: red_mat
    type: lambertian
    albedo: [0.85, 0.15, 0.15]
  - name: blue_mat
    type: lambertian
