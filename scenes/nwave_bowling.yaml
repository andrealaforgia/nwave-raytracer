# nWave Bowling Demo Scene
# The word "nWave" composed of colored boxes in pixel-art style.
# A bowling ball rolls toward the 'W' letter, which has dynamic physics.
# Letters n, a, v, e are static; W blocks and ball are dynamic.

materials:
  - name: floor_gray
    type: lambertian
    albedo: [0.4, 0.4, 0.4]

  - name: ball_metal
    type: metal
    albedo: [0.85, 0.25, 0.1]
    fuzz: 0.05

  - name: letter_n
    type: lambertian
    albedo: [0.2, 0.5, 0.85]

  - name: letter_w
    type: dielectric
    ior: 1.5
    tint: [0.8, 0.9, 1.0]

  - name: letter_a
    type: lambertian
    albedo: [0.85, 0.65, 0.1]

  - name: letter_v
    type: lambertian
    albedo: [0.1, 0.75, 0.3]

  - name: letter_e
    type: lambertian
    albedo: [0.75, 0.2, 0.6]

objects:
  # === Floor ===
  - name: floor
    type: plane
    point: [0.0, 0.0, 0.0]
    normal: [0.0, 1.0, 0.0]
    material: floor_gray

  # === Bowling Ball ===
  - name: bowling_ball
    type: sphere
    center: [5.6, 0.5, 8.0]
    radius: 0.5
    material: ball_metal
    physics:
      body_type: dynamic
      mass: 5.0
      friction: 0.3
      restitution: 0.4
      initial_velocity: [0.0, 0.0, -10.0]

  # =============================================
  # Letter 'n' (static) — x offset: 0.0, z: 0.0
  # Grid: 5 wide x 7 tall, block size 0.4
  # Pattern:
  #   X . . . X
  #   X X . . X
  #   X . X . X
  #   X . . X X
  #   X . . . X
  #   X . . . X
  #   X . . . X
  # =============================================

  # n - column 0 (full height)
  - { name: n_0_0, type: box, min: [0.0, 0.0, 0.0], max: [0.4, 0.4, 0.4], material: letter_n }
  - { name: n_0_1, type: box, min: [0.0, 0.4, 0.0], max: [0.4, 0.8, 0.4], material: letter_n }
  - { name: n_0_2, type: box, min: [0.0, 0.8, 0.0], max: [0.4, 1.2, 0.4], material: letter_n }
  - { name: n_0_3, type: box, min: [0.0, 1.2, 0.0], max: [0.4, 1.6, 0.4], material: letter_n }
  - { name: n_0_4, type: box, min: [0.0, 1.6, 0.0], max: [0.4, 2.0, 0.4], material: letter_n }
  - { name: n_0_5, type: box, min: [0.0, 2.0, 0.0], max: [0.4, 2.4, 0.4], material: letter_n }
  - { name: n_0_6, type: box, min: [0.0, 2.4, 0.0], max: [0.4, 2.8, 0.4], material: letter_n }
  # n - diagonal/bridge
  - { name: n_1_5, type: box, min: [0.4, 2.0, 0.0], max: [0.8, 2.4, 0.4], material: letter_n }
  - { name: n_2_4, type: box, min: [0.8, 1.6, 0.0], max: [1.2, 2.0, 0.4], material: letter_n }
  - { name: n_3_3, type: box, min: [1.2, 1.2, 0.0], max: [1.6, 1.6, 0.4], material: letter_n }
  # n - column 4 (full height)
  - { name: n_4_0, type: box, min: [1.6, 0.0, 0.0], max: [2.0, 0.4, 0.4], material: letter_n }
  - { name: n_4_1, type: box, min: [1.6, 0.4, 0.0], max: [2.0, 0.8, 0.4], material: letter_n }
  - { name: n_4_2, type: box, min: [1.6, 0.8, 0.0], max: [2.0, 1.2, 0.4], material: letter_n }
  - { name: n_4_3, type: box, min: [1.6, 1.2, 0.0], max: [2.0, 1.6, 0.4], material: letter_n }
  - { name: n_4_4, type: box, min: [1.6, 1.6, 0.0], max: [2.0, 2.0, 0.4], material: letter_n }
  - { name: n_4_5, type: box, min: [1.6, 2.0, 0.0], max: [2.0, 2.4, 0.4], material: letter_n }
  - { name: n_4_6, type: box, min: [1.6, 2.4, 0.0], max: [2.0, 2.8, 0.4], material: letter_n }

  # =============================================
  # Letter 'W' (dynamic) — x offset: 3.2, z: 0.0
  # Pattern (5 wide x 7 tall):
  #   X . . . X
  #   X . . . X
  #   X . . . X
  #   X . X . X
  #   X . X . X
  #   X X . X X
  #   . X . X .
  # Row 0 = bottom, Row 6 = top
  # =============================================

  # W - left column (rows 1-6, top to bottom = y 0.4 to 2.8)
  - name: w_0_1
    type: box
    min: [3.2, 0.4, 0.0]
    max: [3.6, 0.8, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_0_2
    type: box
    min: [3.2, 0.8, 0.0]
    max: [3.6, 1.2, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_0_3
    type: box
    min: [3.2, 1.2, 0.0]
    max: [3.6, 1.6, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_0_4
    type: box
    min: [3.2, 1.6, 0.0]
    max: [3.6, 2.0, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_0_5
    type: box
    min: [3.2, 2.0, 0.0]
    max: [3.6, 2.4, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_0_6
    type: box
    min: [3.2, 2.4, 0.0]
    max: [3.6, 2.8, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  # W - second column bottom (rows 0 and 1)
  - name: w_1_0
    type: box
    min: [3.6, 0.0, 0.0]
    max: [4.0, 0.4, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_1_1
    type: box
    min: [3.6, 0.4, 0.0]
    max: [4.0, 0.8, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  # W - center column (rows 2 and 3)
  - name: w_2_2
    type: box
    min: [4.0, 0.8, 0.0]
    max: [4.4, 1.2, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_2_3
    type: box
    min: [4.0, 1.2, 0.0]
    max: [4.4, 1.6, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  # W - fourth column bottom (rows 0 and 1)
  - name: w_3_0
    type: box
    min: [4.4, 0.0, 0.0]
    max: [4.8, 0.4, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_3_1
    type: box
    min: [4.4, 0.4, 0.0]
    max: [4.8, 0.8, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  # W - right column (rows 1-6)
  - name: w_4_1
    type: box
    min: [4.8, 0.4, 0.0]
    max: [5.2, 0.8, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_4_2
    type: box
    min: [4.8, 0.8, 0.0]
    max: [5.2, 1.2, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_4_3
    type: box
    min: [4.8, 1.2, 0.0]
    max: [5.2, 1.6, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_4_4
    type: box
    min: [4.8, 1.6, 0.0]
    max: [5.2, 2.0, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_4_5
    type: box
    min: [4.8, 2.0, 0.0]
    max: [5.2, 2.4, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }
  - name: w_4_6
    type: box
    min: [4.8, 2.4, 0.0]
    max: [5.2, 2.8, 0.4]
    material: letter_w
    physics: { body_type: dynamic, mass: 0.2, restitution: 0.5 }

  # =============================================
  # Letter 'a' (static) — x offset: 6.4, z: 0.0
  # Pattern (5 wide x 7 tall):
  #   . X X X .
  #   X . . . X
  #   X . . . X
  #   X X X X X
  #   X . . . X
  #   X . . . X
  #   X . . . X
  # Row 0 = bottom, Row 6 = top
  # =============================================

  # a - left column (rows 0-4)
  - { name: a_0_0, type: box, min: [6.4, 0.0, 0.0], max: [6.8, 0.4, 0.4], material: letter_a }
  - { name: a_0_1, type: box, min: [6.4, 0.4, 0.0], max: [6.8, 0.8, 0.4], material: letter_a }
  - { name: a_0_2, type: box, min: [6.4, 0.8, 0.0], max: [6.8, 1.2, 0.4], material: letter_a }
  - { name: a_0_3, type: box, min: [6.4, 1.2, 0.0], max: [6.8, 1.6, 0.4], material: letter_a }
  - { name: a_0_4, type: box, min: [6.4, 1.6, 0.0], max: [6.8, 2.0, 0.4], material: letter_a }
  - { name: a_0_5, type: box, min: [6.4, 2.0, 0.0], max: [6.8, 2.4, 0.4], material: letter_a }
  # a - top row (row 6: columns 1-3)
  - { name: a_1_6, type: box, min: [6.8, 2.4, 0.0], max: [7.2, 2.8, 0.4], material: letter_a }
  - { name: a_2_6, type: box, min: [7.2, 2.4, 0.0], max: [7.6, 2.8, 0.4], material: letter_a }
  - { name: a_3_6, type: box, min: [7.6, 2.4, 0.0], max: [8.0, 2.8, 0.4], material: letter_a }
  # a - middle bar (row 3: columns 1-3)
  - { name: a_1_3, type: box, min: [6.8, 1.2, 0.0], max: [7.2, 1.6, 0.4], material: letter_a }
  - { name: a_2_3, type: box, min: [7.2, 1.2, 0.0], max: [7.6, 1.6, 0.4], material: letter_a }
  - { name: a_3_3, type: box, min: [7.6, 1.2, 0.0], max: [8.0, 1.6, 0.4], material: letter_a }
  # a - right column (rows 0-5)
  - { name: a_4_0, type: box, min: [8.0, 0.0, 0.0], max: [8.4, 0.4, 0.4], material: letter_a }
  - { name: a_4_1, type: box, min: [8.0, 0.4, 0.0], max: [8.4, 0.8, 0.4], material: letter_a }
  - { name: a_4_2, type: box, min: [8.0, 0.8, 0.0], max: [8.4, 1.2, 0.4], material: letter_a }
  - { name: a_4_3, type: box, min: [8.0, 1.2, 0.0], max: [8.4, 1.6, 0.4], material: letter_a }
  - { name: a_4_4, type: box, min: [8.0, 1.6, 0.0], max: [8.4, 2.0, 0.4], material: letter_a }
  - { name: a_4_5, type: box, min: [8.0, 2.0, 0.0], max: [8.4, 2.4, 0.4], material: letter_a }

  # =============================================
  # Letter 'v' (static) — x offset: 9.6, z: 0.0
  # Pattern (5 wide x 7 tall):
  #   X . . . X
  #   X . . . X
  #   X . . . X
  #   X . . . X
  #   . X . X .
  #   . X . X .
  #   . . X . .
  # Row 0 = bottom, Row 6 = top
  # =============================================

  # v - left column top (rows 3-6)
  - { name: v_0_3, type: box, min: [9.6, 1.2, 0.0], max: [10.0, 1.6, 0.4], material: letter_v }
  - { name: v_0_4, type: box, min: [9.6, 1.6, 0.0], max: [10.0, 2.0, 0.4], material: letter_v }
  - { name: v_0_5, type: box, min: [9.6, 2.0, 0.0], max: [10.0, 2.4, 0.4], material: letter_v }
  - { name: v_0_6, type: box, min: [9.6, 2.4, 0.0], max: [10.0, 2.8, 0.4], material: letter_v }
  # v - inner left (rows 1-2)
  - { name: v_1_1, type: box, min: [10.0, 0.4, 0.0], max: [10.4, 0.8, 0.4], material: letter_v }
  - { name: v_1_2, type: box, min: [10.0, 0.8, 0.0], max: [10.4, 1.2, 0.4], material: letter_v }
  # v - bottom center (row 0)
  - { name: v_2_0, type: box, min: [10.4, 0.0, 0.0], max: [10.8, 0.4, 0.4], material: letter_v }
  # v - inner right (rows 1-2)
  - { name: v_3_1, type: box, min: [10.8, 0.4, 0.0], max: [11.2, 0.8, 0.4], material: letter_v }
  - { name: v_3_2, type: box, min: [10.8, 0.8, 0.0], max: [11.2, 1.2, 0.4], material: letter_v }
  # v - right column top (rows 3-6)
  - { name: v_4_3, type: box, min: [11.2, 1.2, 0.0], max: [11.6, 1.6, 0.4], material: letter_v }
  - { name: v_4_4, type: box, min: [11.2, 1.6, 0.0], max: [11.6, 2.0, 0.4], material: letter_v }
  - { name: v_4_5, type: box, min: [11.2, 2.0, 0.0], max: [11.6, 2.4, 0.4], material: letter_v }
  - { name: v_4_6, type: box, min: [11.2, 2.4, 0.0], max: [11.6, 2.8, 0.4], material: letter_v }

  # =============================================
  # Letter 'e' (static) — x offset: 12.8, z: 0.0
  # Pattern (5 wide x 7 tall):
  #   X X X X X
  #   X . . . .
  #   X . . . .
  #   X X X X X
  #   X . . . .
  #   X . . . .
  #   X X X X X
  # Row 0 = bottom, Row 6 = top
  # =============================================

  # e - left column (full height)
  - { name: e_0_0, type: box, min: [12.8, 0.0, 0.0], max: [13.2, 0.4, 0.4], material: letter_e }
  - { name: e_0_1, type: box, min: [12.8, 0.4, 0.0], max: [13.2, 0.8, 0.4], material: letter_e }
  - { name: e_0_2, type: box, min: [12.8, 0.8, 0.0], max: [13.2, 1.2, 0.4], material: letter_e }
  - { name: e_0_3, type: box, min: [12.8, 1.2, 0.0], max: [13.2, 1.6, 0.4], material: letter_e }
  - { name: e_0_4, type: box, min: [12.8, 1.6, 0.0], max: [13.2, 2.0, 0.4], material: letter_e }
  - { name: e_0_5, type: box, min: [12.8, 2.0, 0.0], max: [13.2, 2.4, 0.4], material: letter_e }
  - { name: e_0_6, type: box, min: [12.8, 2.4, 0.0], max: [13.2, 2.8, 0.4], material: letter_e }
  # e - bottom row (row 0: columns 1-4)
  - { name: e_1_0, type: box, min: [13.2, 0.0, 0.0], max: [13.6, 0.4, 0.4], material: letter_e }
  - { name: e_2_0, type: box, min: [13.6, 0.0, 0.0], max: [14.0, 0.4, 0.4], material: letter_e }
  - { name: e_3_0, type: box, min: [14.0, 0.0, 0.0], max: [14.4, 0.4, 0.4], material: letter_e }
  - { name: e_4_0, type: box, min: [14.4, 0.0, 0.0], max: [14.8, 0.4, 0.4], material: letter_e }
  # e - middle bar (row 3: columns 1-4)
  - { name: e_1_3, type: box, min: [13.2, 1.2, 0.0], max: [13.6, 1.6, 0.4], material: letter_e }
  - { name: e_2_3, type: box, min: [13.6, 1.2, 0.0], max: [14.0, 1.6, 0.4], material: letter_e }
  - { name: e_3_3, type: box, min: [14.0, 1.2, 0.0], max: [14.4, 1.6, 0.4], material: letter_e }
  - { name: e_4_3, type: box, min: [14.4, 1.2, 0.0], max: [14.8, 1.6, 0.4], material: letter_e }
  # e - top row (row 6: columns 1-4)
  - { name: e_1_6, type: box, min: [13.2, 2.4, 0.0], max: [13.6, 2.8, 0.4], material: letter_e }
  - { name: e_2_6, type: box, min: [13.6, 2.4, 0.0], max: [14.0, 2.8, 0.4], material: letter_e }
  - { name: e_3_6, type: box, min: [14.0, 2.4, 0.0], max: [14.4, 2.8, 0.4], material: letter_e }
  - { name: e_4_6, type: box, min: [14.4, 2.4, 0.0], max: [14.8, 2.8, 0.4], material: letter_e }

lights:
  - type: point
    position: [7.0, 8.0, 6.0]
    color: [1.0, 1.0, 1.0]
    intensity: 1.0

  - type: directional
    direction: [-0.3, -1.0, -0.5]
    color: [0.9, 0.9, 1.0]
    intensity: 0.4

camera:
  lookfrom: [7.0, 4.0, 12.0]
  lookat: [7.0, 1.2, 0.0]
  vup: [0.0, 1.0, 0.0]
  vfov: 45.0
  aspect_ratio: 1.7778
  image_width: 800

animation:
  duration: 5.0
  physics_timestep: 0.01667
  render_fps: 30
  output_directory: "frames/bowling/"
