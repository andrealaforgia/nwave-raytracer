project_id: scene-physics-animation
goal: "YAML scene loading, Jolt Physics integration, and animated frame rendering for nwave-raytracer"
created: 2026-02-17

phases:
  # ============================================================================
  # Phase 01: Core Math Extensions
  # Ring 1 foundation types needed by TransformedShape and physics transform pipeline.
  # No external dependencies. Pure value types.
  # ============================================================================
  - id: "01"
    name: "Core Math Extensions"
    steps:
      - id: "01-01"
        title: "Quaternion type"
        description: "Unit quaternion for 3D rotation: identity, from_axis_angle, conjugate, normalized, to_matrix, Hamilton product, slerp"
        user_stories: ["US-SPA-022"]
        files_to_create:
          - src/core/quaternion.h
        files_to_modify: []
        test_files:
          - tests/core/quaternion_test.cpp
        acceptance_criteria:
          - "identity() returns (0, 0, 0, 1)"
          - "from_axis_angle(Y, 90deg) produces correct quaternion components"
          - "conjugate negates xyz, preserves w"
          - "normalized() returns unit-length quaternion"
          - "Hamilton product of two 90-degree rotations equals 180-degree rotation"
        depends_on: []

      - id: "01-02"
        title: "Matrix4x4 type with quaternion construction"
        description: "4x4 transform matrix: identity, translation, from_translation_rotation, multiply, inverse, transpose, transform_point, transform_vector, transform_normal"
        user_stories: ["US-SPA-022"]
        files_to_create:
          - src/core/matrix4x4.h
        files_to_modify: []
        test_files:
          - tests/core/matrix4x4_test.cpp
        acceptance_criteria:
          - "identity() leaves points unchanged under transform_point"
          - "translation(1,2,3) shifts point by (1,2,3)"
          - "from_translation_rotation with 90-deg Y rotation produces correct matrix"
          - "M * M.inverse() approximates identity within 1e-10"
          - "transform_normal uses inverse-transpose (verified with non-uniform scale)"
        depends_on: ["01-01"]

  # ============================================================================
  # Phase 02: YAML Scene Loading (Walking Skeleton)
  # End-to-end: YAML file -> domain objects -> rendered PPM. Minimal scope.
  # Adds yaml-cpp dependency. Sphere + Plane + PointLight only.
  # ============================================================================
  - id: "02"
    name: "YAML Scene Loading (Walking Skeleton)"
    steps:
      - id: "02-01"
        title: "Add yaml-cpp via FetchContent"
        description: "Integrate yaml-cpp 0.8.x in root CMakeLists.txt. Link to nwave_infrastructure. Verify builds."
        user_stories: ["US-SPA-000"]
        files_to_create: []
        files_to_modify:
          - CMakeLists.txt
          - src/CMakeLists.txt
        test_files: []
        acceptance_criteria:
          - "Project builds with yaml-cpp linked to nwave_infrastructure"
          - "yaml-cpp headers includable from infrastructure sources"
        depends_on: []

      - id: "02-02"
        title: "YamlSceneLoader: materials parsing"
        description: "Parse materials section from YAML: Lambertian (albedo), Metal (albedo, fuzz), Dielectric (ior, tint). Build name->Material map."
        user_stories: ["US-SPA-000"]
        files_to_create:
          - src/infrastructure/yaml_scene_loader.h
          - src/infrastructure/yaml_scene_loader.cpp
        files_to_modify:
          - src/CMakeLists.txt
        test_files:
          - tests/infrastructure/yaml_scene_loader_test.cpp
        acceptance_criteria:
          - "Lambertian material parsed with correct albedo"
          - "Metal material parsed with albedo and fuzz"
          - "Dielectric material parsed with ior and optional tint"
          - "Material names stored in lookup map for reference resolution"
        depends_on: ["02-01"]

      - id: "02-03"
        title: "YamlSceneLoader: sphere, plane, point light, camera"
        description: "Parse objects (sphere, plane), lights (point), and camera sections. Resolve material references by name. Return SceneLoadResult."
        user_stories: ["US-SPA-000"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/yaml_scene_loader.h
          - src/infrastructure/yaml_scene_loader.cpp
        test_files:
          - tests/infrastructure/yaml_scene_loader_test.cpp
        acceptance_criteria:
          - "Sphere parsed with center, radius, and resolved material"
          - "Plane parsed with point, normal, and resolved material"
          - "PointLight parsed with position, color, intensity"
          - "Camera parsed with lookfrom, lookat, vup, vfov, image_width"
          - "Unknown material reference produces error naming the reference"
        depends_on: ["02-02"]

      - id: "02-04"
        title: "CLI dispatcher with render subcommand"
        description: "Parse 'nwave render <file>' and '--width', '--spp' flags. Route to YAML load + render pipeline. Replace hardcoded main.cpp flow."
        user_stories: ["US-SPA-000", "US-SPA-013"]
        files_to_create:
          - src/infrastructure/cli_dispatcher.h
          - src/infrastructure/cli_dispatcher.cpp
        files_to_modify:
          - src/main.cpp
          - src/CMakeLists.txt
        test_files:
          - tests/infrastructure/cli_dispatcher_test.cpp
        acceptance_criteria:
          - "'nwave render scene.yaml' loads YAML and renders to PPM"
          - "'--width 400' overrides image width"
          - "'--spp 4' overrides samples per pixel"
          - "No arguments or '--help' prints usage with subcommands"
          - "Unknown subcommand prints help and exits non-zero"
        depends_on: ["02-03"]

  # ============================================================================
  # Phase 03: Full Scene Loading
  # Complete shape coverage, validation, Emissive/Directional light, CLI validate.
  # ============================================================================
  - id: "03"
    name: "Full Scene Loading"
    steps:
      - id: "03-01"
        title: "YamlSceneLoader: box, cylinder, triangle, triangle_mesh"
        description: "Extend loader with remaining shape types. Unknown type produces error listing supported types."
        user_stories: ["US-SPA-010"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/yaml_scene_loader.h
          - src/infrastructure/yaml_scene_loader.cpp
        test_files:
          - tests/infrastructure/yaml_scene_loader_test.cpp
        acceptance_criteria:
          - "Box parsed with min/max corners and material"
          - "Cylinder parsed with center, radius, height, material"
          - "Triangle parsed with v0, v1, v2, material"
          - "TriangleMesh parsed with vertices, indices, material"
          - "Unknown type 'cone' error lists all six supported types"
        depends_on: ["02-03"]

      - id: "03-02"
        title: "YamlSceneLoader: directional light and emissive material"
        description: "Parse directional light (direction, color, intensity) and emissive material (color, intensity) from YAML."
        user_stories: ["US-SPA-012"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/yaml_scene_loader.h
          - src/infrastructure/yaml_scene_loader.cpp
        test_files:
          - tests/infrastructure/yaml_scene_loader_test.cpp
        acceptance_criteria:
          - "DirectionalLight parsed with direction, color, intensity"
          - "Emissive material parsed with color and intensity"
          - "Scene with both point and directional lights loads correctly"
        depends_on: ["02-03"]

      - id: "03-03"
        title: "Scene validator"
        description: "Validate loaded scene: structure completeness, material references, parameter ranges. Collect all errors in single pass. Edit-distance suggestions for misspelled materials."
        user_stories: ["US-SPA-011"]
        files_to_create:
          - src/infrastructure/validator.h
          - src/infrastructure/validator.cpp
        files_to_modify:
          - src/CMakeLists.txt
        test_files:
          - tests/infrastructure/validator_test.cpp
        acceptance_criteria:
          - "Valid scene passes all checks with exit code 0"
          - "Missing camera reports camera-required error"
          - "Negative mass reported with object name and value"
          - "Multiple errors collected and reported in one pass"
          - "Misspelled material 'geen_glass' suggests 'green_glass'"
        depends_on: ["02-03"]

      - id: "03-04"
        title: "CLI validate subcommand"
        description: "Wire 'nwave validate <file>' to loader + validator. Print checklist. No render on validate."
        user_stories: ["US-SPA-013", "US-SPA-011"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/cli_dispatcher.h
          - src/infrastructure/cli_dispatcher.cpp
          - src/main.cpp
        test_files:
          - tests/infrastructure/cli_dispatcher_test.cpp
        acceptance_criteria:
          - "'nwave validate scene.yaml' runs validation, prints checklist"
          - "No image file produced on validate"
          - "Exit code 0 for valid scene, non-zero for invalid"
        depends_on: ["02-04", "03-03"]

  # ============================================================================
  # Phase 04: Physics Foundation
  # Jolt Physics integration. Sphere-falls-on-plane test. Shape-to-body mapping.
  # ============================================================================
  - id: "04"
    name: "Physics Foundation"
    steps:
      - id: "04-01"
        title: "PhysicsProperties domain struct"
        description: "BodyType enum (STATIC, DYNAMIC, KINEMATIC) and PhysicsProperties struct (body_type, mass, initial_velocity, friction, restitution) in Ring 2."
        user_stories: ["US-SPA-020"]
        files_to_create:
          - src/domain/physics_properties.h
        files_to_modify: []
        test_files:
          - tests/domain/physics_properties_test.cpp
        acceptance_criteria:
          - "Default body_type is STATIC"
          - "Default mass is 1.0, friction 0.5, restitution 0.3"
          - "initial_velocity defaults to (0,0,0)"
        depends_on: []

      - id: "04-02"
        title: "PhysicsSimulator interface and PhysicsTransform"
        description: "Abstract PhysicsSimulator in Ring 3: add_body, step, get_transform, set_gravity. PhysicsTransform struct (position, rotation). PhysicsBodyDesc, PhysicsShapeType enum."
        user_stories: ["US-SPA-020"]
        files_to_create:
          - src/application/physics_simulator.h
        files_to_modify: []
        test_files: []
        acceptance_criteria:
          - "PhysicsSimulator is abstract with pure virtual methods"
          - "PhysicsTransform holds Point3 position and Quaternion rotation"
          - "PhysicsBodyDesc carries shape type, dimensions, and PhysicsProperties"
          - "No Jolt headers included in this file"
        depends_on: ["04-01", "01-01"]

      - id: "04-03"
        title: "Add Jolt Physics via FetchContent"
        description: "Integrate Jolt Physics 5.2.x in root CMakeLists.txt with DOUBLE_PRECISION. Link to nwave_infrastructure."
        user_stories: ["US-SPA-020"]
        files_to_create: []
        files_to_modify:
          - CMakeLists.txt
          - src/CMakeLists.txt
        test_files: []
        acceptance_criteria:
          - "Project builds with Jolt linked to nwave_infrastructure"
          - "DOUBLE_PRECISION is enabled"
          - "Jolt headers includable from infrastructure sources only"
        depends_on: ["02-01"]

      - id: "04-04"
        title: "JoltPhysicsSimulator: sphere falls onto plane"
        description: "Implement JoltPhysicsSimulator (Ring 4) with Jolt init/cleanup, layer callbacks, add_body for sphere and plane, step, get_transform, set_gravity."
        user_stories: ["US-SPA-020"]
        files_to_create:
          - src/infrastructure/jolt_physics_simulator.h
          - src/infrastructure/jolt_physics_simulator.cpp
        files_to_modify:
          - src/CMakeLists.txt
        test_files:
          - tests/infrastructure/jolt_physics_simulator_test.cpp
        acceptance_criteria:
          - "Sphere at y=5 falls below y=1 after 60 steps at dt=1/60"
          - "Sphere with restitution 0.6 bounces above plane after contact"
          - "Static plane remains at y=0 after 300 steps"
          - "New simulator instance has no state from previous instance"
        depends_on: ["04-02", "04-03"]

      - id: "04-05"
        title: "JoltPhysicsSimulator: box shape mapping"
        description: "Extend add_body to map Box shapes (min/max -> center + half-extents). Verify sphere-box collision."
        user_stories: ["US-SPA-021"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/jolt_physics_simulator.h
          - src/infrastructure/jolt_physics_simulator.cpp
        test_files:
          - tests/infrastructure/jolt_physics_simulator_test.cpp
        acceptance_criteria:
          - "Box with min [2,0,-0.5] max [3,1.5,0.5] creates body at center [2.5,0.75,0] with half-extents [0.5,0.75,0.5]"
          - "Sphere rolling into box pushes box from original position"
          - "Sphere velocity changes after box collision (energy transfer)"
        depends_on: ["04-04"]

  # ============================================================================
  # Phase 05: Transform Pipeline
  # TransformedShape bridges physics output to render input.
  # ============================================================================
  - id: "05"
    name: "Transform Pipeline"
    steps:
      - id: "05-01"
        title: "TransformedShape: translation"
        description: "TransformedShape wraps a Shape with Matrix4x4. On hit(): transform ray to local space, delegate to inner shape, transform result back. Start with translation only."
        user_stories: ["US-SPA-022"]
        files_to_create:
          - src/domain/shapes/transformed_shape.h
          - src/domain/shapes/transformed_shape.cpp
        files_to_modify:
          - src/CMakeLists.txt
        test_files:
          - tests/domain/transformed_shape_test.cpp
        acceptance_criteria:
          - "Sphere at origin translated by [3,0,0] is hit by ray aimed at [3,0,0]"
          - "Same sphere is missed by ray aimed at origin [0,0,0]"
          - "Hit point is in world space at the translated position"
          - "set_transform updates position for subsequent hit tests"
        depends_on: ["01-02"]

      - id: "05-02"
        title: "TransformedShape: rotation and normal transformation"
        description: "Extend TransformedShape to handle rotation via full Matrix4x4. Normals transformed using inverse-transpose."
        user_stories: ["US-SPA-022"]
        files_to_create: []
        files_to_modify:
          - src/domain/shapes/transformed_shape.h
          - src/domain/shapes/transformed_shape.cpp
        test_files:
          - tests/domain/transformed_shape_test.cpp
        acceptance_criteria:
          - "Box rotated 45deg around Y is hit by ray that misses axis-aligned box"
          - "Normal on rotated box face is rotated 45deg from original normal"
          - "Normal is unit length after transformation"
        depends_on: ["05-01"]

  # ============================================================================
  # Phase 06: Physics Scene Loading
  # Parse physics properties and animation config from YAML.
  # ============================================================================
  - id: "06"
    name: "Physics Scene Loading"
    steps:
      - id: "06-01"
        title: "AnimationConfig domain struct"
        description: "AnimationConfig struct in Ring 2: duration, physics_timestep, render_fps, output_directory. Derived: total_frames, steps_per_frame, render_dt."
        user_stories: ["US-SPA-023"]
        files_to_create:
          - src/domain/animation_config.h
        files_to_modify: []
        test_files:
          - tests/domain/animation_config_test.cpp
        acceptance_criteria:
          - "total_frames = ceil(5.0 * 30) = 150"
          - "render_dt = 1.0/30 = 0.0333..."
          - "steps_per_frame = round(0.0333 / 0.01667) = 2"
          - "Default output_directory is 'frames/'"
        depends_on: []

      - id: "06-02"
        title: "YamlSceneLoader: physics and animation sections"
        description: "Parse optional physics block per object and animation section. Objects without physics default to static."
        user_stories: ["US-SPA-023"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/yaml_scene_loader.h
          - src/infrastructure/yaml_scene_loader.cpp
        test_files:
          - tests/infrastructure/yaml_scene_loader_test.cpp
        acceptance_criteria:
          - "physics block parsed with body_type, mass, initial_velocity, friction, restitution"
          - "Missing physics block defaults to body_type STATIC"
          - "animation section parsed with duration, physics_timestep, render_fps, output_directory"
          - "PhysicsProperties associated with loaded shapes"
        depends_on: ["02-03", "04-01", "06-01"]

      - id: "06-03"
        title: "Validator: physics and animation checks"
        description: "Extend validator with physics property range checks and animation config validation when --physics-animate is used."
        user_stories: ["US-SPA-011", "US-SPA-023"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/validator.h
          - src/infrastructure/validator.cpp
        test_files:
          - tests/infrastructure/validator_test.cpp
        acceptance_criteria:
          - "Negative mass reported with object name"
          - "Friction > 1.0 reported with object name and value"
          - "Restitution out of [0,1] reported"
          - "Missing animation section when --physics-animate used produces error"
          - "Dynamic TriangleMesh produces concave-mesh-must-be-static error"
        depends_on: ["03-03", "06-02"]

  # ============================================================================
  # Phase 07: Animation Pipeline
  # AnimationRenderer orchestrates physics + render loop. Frame output.
  # ============================================================================
  - id: "07"
    name: "Animation Pipeline"
    steps:
      - id: "07-01"
        title: "AnimationRenderer: frame loop with physics"
        description: "AnimationRenderer (Ring 3) orchestrates: wrap dynamic shapes in TransformedShape, init physics, step per frame, extract transforms, apply to shapes, render, write via callback."
        user_stories: ["US-SPA-030"]
        files_to_create:
          - src/application/animation_renderer.h
          - src/application/animation_renderer.cpp
        files_to_modify:
          - src/CMakeLists.txt
        test_files:
          - tests/application/animation_renderer_test.cpp
        acceptance_criteria:
          - "Frame count equals ceil(duration * render_fps)"
          - "Physics stepped steps_per_frame times between each rendered frame"
          - "TransformedShape transforms updated from physics each frame"
          - "Write callback invoked once per frame with valid filename"
        depends_on: ["05-02", "04-05", "06-01"]

      - id: "07-02"
        title: "Wire --physics-animate CLI flag to animation pipeline"
        description: "Connect CLI --physics-animate to AnimationRenderer. Load YAML, init JoltPhysicsSimulator, run animation loop, write frames as PPM."
        user_stories: ["US-SPA-030", "US-SPA-013"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/cli_dispatcher.h
          - src/infrastructure/cli_dispatcher.cpp
          - src/main.cpp
        test_files:
          - tests/infrastructure/cli_dispatcher_test.cpp
        acceptance_criteria:
          - "'nwave render scene.yaml --physics-animate' produces frame files"
          - "Frame files named frame_0000.ppm through frame_NNNN.ppm"
          - "Output directory created automatically"
          - "Physics summary printed before rendering (body count, step count)"
          - "ffmpeg command printed at completion with correct framerate"
        depends_on: ["07-01", "06-02", "03-04"]

      - id: "07-03"
        title: "Multiple physics steps per render frame"
        description: "Compute steps_per_frame from physics_timestep and render_fps ratio. Step physics correct number of times between frames."
        user_stories: ["US-SPA-031"]
        files_to_create: []
        files_to_modify:
          - src/application/animation_renderer.h
          - src/application/animation_renderer.cpp
        test_files:
          - tests/application/animation_renderer_test.cpp
        acceptance_criteria:
          - "60Hz physics / 30fps render = 2 steps per frame"
          - "120Hz physics / 30fps render = 4 steps per frame"
          - "Total physics time matches animation duration within one timestep"
        depends_on: ["07-01"]

      - id: "07-04"
        title: "CLI flag overrides for animation parameters"
        description: "Add --fps, --output-dir flags. CLI values override YAML values. Precedence: CLI > YAML > default."
        user_stories: ["US-SPA-032"]
        files_to_create: []
        files_to_modify:
          - src/infrastructure/cli_dispatcher.h
          - src/infrastructure/cli_dispatcher.cpp
        test_files:
          - tests/infrastructure/cli_dispatcher_test.cpp
        acceptance_criteria:
          - "'--width 400' produces 400px-wide frame images"
          - "'--fps 60' overrides YAML render_fps and adjusts frame count"
          - "'--output-dir /tmp/test' overrides YAML output directory"
          - "Precedence: CLI flag > YAML value > built-in default"
        depends_on: ["07-02"]

  # ============================================================================
  # Phase 08: Bowling Demo
  # Complete demo scene YAML + progress bar. Integration test of entire feature.
  # ============================================================================
  - id: "08"
    name: "Bowling Demo and Polish"
    steps:
      - id: "08-01"
        title: "nWave bowling demo scene YAML"
        description: "Create scenes/nwave_bowling.yaml with all 5 letters (boxes), chessboard floor, bowling ball, physics on W blocks and ball, animation config 5s/30fps."
        user_stories: ["US-SPA-050"]
        files_to_create:
          - scenes/nwave_bowling.yaml
        files_to_modify: []
        test_files: []
        acceptance_criteria:
          - "scenes/nwave_bowling.yaml passes 'nwave validate' with all checks OK"
          - "Scene contains letters n, W, a, v, e as box compositions"
          - "Ball and W blocks are dynamic; n, a, v, e blocks are static"
          - "Animation config: duration 5.0, render_fps 30, 150 total frames"
        depends_on: ["07-02", "06-03"]

      - id: "08-02"
        title: "Minimal test scene YAML"
        description: "Create scenes/simple.yaml with 1 sphere, 1 plane, 1 point light, camera. Used for fast integration testing."
        user_stories: ["US-SPA-000"]
        files_to_create:
          - scenes/simple.yaml
        files_to_modify: []
        test_files: []
        acceptance_criteria:
          - "scenes/simple.yaml passes validation"
          - "'nwave render scenes/simple.yaml' produces valid PPM output"
          - "Rendered image has non-black pixels (scene actually rendered)"
        depends_on: ["02-04"]

      - id: "08-03"
        title: "Render progress bar with ETA"
        description: "Progress reporter for multi-frame renders: frame counter (N/total), percentage, text progress bar, ETA from running average, total elapsed at completion."
        user_stories: ["US-SPA-051"]
        files_to_create:
          - src/infrastructure/progress_reporter.h
          - src/infrastructure/progress_reporter.cpp
        files_to_modify:
          - src/CMakeLists.txt
          - src/application/animation_renderer.h
          - src/application/animation_renderer.cpp
        test_files:
          - tests/infrastructure/progress_reporter_test.cpp
        acceptance_criteria:
          - "Frame counter shows 'Frame N/total' after each frame"
          - "Percentage computed and displayed (e.g., '50%')"
          - "ETA decreases as render progresses"
          - "Completion line shows 'Done' with total elapsed time"
        depends_on: ["07-01"]

