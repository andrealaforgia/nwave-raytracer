    timestamp: "2026-02-19"
    notes: >
      Created DeformableMesh as Shape subclass with Moller-Trumbore ray-triangle intersection.
      Constructor takes face_indices and material. update_vertices() sets vertex positions,
      computes area-weighted smooth normals, and computes tight AABB. hit() performs linear
      face scan with barycentric interpolation of per-vertex normals. All 344 tests pass
      (7 new + 337 existing).

