    timestamp: "2026-02-19"
    notes: >
      Implemented get_soft_body_mesh() in JoltPhysicsSimulator. Uses BodyLockRead to
      safely access the soft body, casts to SoftBodyMotionProperties, extracts vertices
      from GetVertices() and transforms to world space via GetCenterOfMassTransform().
      Face indices extracted from shared settings mFaces. Validates body_id range and
      soft body membership. All 373 tests pass (7 new + 366 existing).

  - id: "03-02"
    status: "COMMIT"
    tests_written:
