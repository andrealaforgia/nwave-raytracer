      - "src/application/animation_renderer.cpp"
      - "src/domain/soft_body_desc.h"
      - "tests/CMakeLists.txt"
    timestamp: "2026-02-19"
    notes: >
      Extended AnimationRenderer to handle soft bodies alongside rigid bodies.
      Constructor now accepts optional vector<SoftBodyDesc> as last parameter with
      default empty vector (backward compatible). During setup: calls add_soft_body()
      for each desc, fetches initial mesh via get_soft_body_mesh(), creates
      DeformableMesh with face indices and material, sets initial vertices, and adds
      to animation scene. Per frame: calls get_soft_body_mesh() and update_vertices()
      for each soft body before rendering. Frame 0 renders before first physics step,
      showing soft bodies at initial position. Added material field to SoftBodyDesc
      (const Material* material = nullptr). All 378 tests pass (5 new + 373 existing).
      Existing 12 AnimationRenderer tests pass unchanged.

