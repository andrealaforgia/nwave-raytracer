      All 3 existing scene files (simple.yaml, nwave_bowling.yaml, gpu_showcase.yaml) parse
      without error with empty soft_body_descs. All 385 tests pass (7 new + 378 existing).

  - id: "05-02"
    status: "COMMIT"
