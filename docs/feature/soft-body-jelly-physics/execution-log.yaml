      Updated FakePhysicsSimulator and FakePhysicsForProgress test doubles to
      implement the new pure virtuals. All 712 tests pass (3 new + 709 existing).

  - id: "02-00"
    status: "COMMIT"
    tests_written:
      - "JoltSoftBodyApiSpike.SharedSettingsAcceptsVerticesFacesAndConstraints"
      - "JoltSoftBodyApiSpike.CreationSettingsCanBeConstructedFromSharedSettings"
      - "JoltSoftBodyApiSpike.CreateConstraintsAutomaticallyGeneratesEdgesFromFaces"
    tests_passing: true
    files_created:
      - "tests/infrastructure/jolt_soft_body_api_spike_test.cpp"
    files_modified:
      - "tests/CMakeLists.txt"
    timestamp: "2026-02-19"
    notes: >
      Spike: Validated Jolt v5.2.0 XPBD soft body API availability. All 3 required
      headers (SoftBodySharedSettings.h, SoftBodyCreationSettings.h,
      SoftBodyMotionProperties.h) compile successfully. Verified the full soft body
      creation pattern from Jolt's SoftBodyCreator sample: 3D vertex grid creation,
      edge constraints with CalculateEdgeLengths(), volume constraints (tetrahedra)
      with CalculateVolumeConstraintVolumes(), face creation via AddFace(),
      Optimize() for parallel constraint execution, Ref<> reference counting,
      SoftBodyCreationSettings 4-arg constructor (shared settings, position,
      rotation, object layer), configurable simulation parameters (iterations,
      pressure, restitution, friction, damping, gravity factor), and automatic
      constraint generation via CreateConstraints() with VertexAttributes and
      EBendType. API matches expected XPBD patterns. Jolt requires
      RegisterDefaultAllocator(), Factory creation, and RegisterTypes() before use.
      All 301 tests pass (3 new + 298 existing).

  - id: "02-01"
    status: "COMMIT"
    tests_written:
      - "JoltSoftBodyCreationTest.AddSoftBodyReturnsValidIndex"
      - "JoltSoftBodyCreationTest.FiveByFiveByFiveSoftBodyCreatesSuccessfully"
      - "JoltSoftBodyCreationTest.SoftBodyPlacedAtSpecifiedPosition"
      - "JoltSoftBodyCreationTest.SoftBodyAcceptsCustomParameters"
      - "JoltSoftBodyCreationTest.IsSoftBodyDistinguishesSoftFromRigid"
      - "JoltSoftBodyCreationTest.IsSoftBodyReturnsFalseForOutOfRangeId"
      - "JoltSoftBodyCreationTest.SoftBodyFallsUnderGravity"
    tests_passing: true
    files_created:
      - "tests/infrastructure/jolt_soft_body_creation_test.cpp"
    files_modified:
      - "src/infrastructure/jolt_physics_simulator.cpp"
      - "tests/CMakeLists.txt"
      - "tests/application/physics_simulator_soft_body_api_test.cpp"
    timestamp: "2026-02-19"
    notes: >
      Implemented add_soft_body() and is_soft_body() in JoltPhysicsSimulator using
      Jolt's XPBD soft body API. add_soft_body() creates a NxNxN vertex grid centered
      at the specified position, adds axis-aligned edge constraints with configurable
      compliance, decomposes each cube cell into 6 tetrahedra for volume constraints,
      generates triangulated surface faces on all 6 outer faces, and applies pressure,
      restitution, friction, damping, and solver_iterations from SoftBodyDesc.
      Soft body IDs tracked in std::set<int> soft_body_ids in the Impl struct.
      is_soft_body() checks membership in the set, returning false for out-of-range IDs.
      get_soft_body_mesh() left as stub (step 02-02). Updated 2 existing stub tests
      in physics_simulator_soft_body_api_test.cpp that expected "not implemented" throws.
      All 308 tests pass (7 new + 301 existing).

